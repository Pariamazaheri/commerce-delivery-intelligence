[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-delivery-intelligence"
version = "1.0.0"
description = "Reproducible delivery reliability and customer experience analytics"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "numpy>=1.26,<3", "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4", "seaborn>=0.13,<0.14", "plotly>=5.24,<8",
  "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8"]

[project.scripts]
commerce-insights = "commerce_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
